# The context timeline (zigzag). One entry per date, in order.
# image: where the site looks for the picture. Drop a file with exactly this name in assets/img/context/
#        and it appears; as long as the file is missing, the card shows "Image to find".
# image_page: where the image comes from (to check the licence and copy the credit).
# credit: author and licence, shown under the image. Copy it exactly from the image page.
# source / source_url: the reference that backs the text, shown as a link under the card.
- date: "31 Dec 2019"
  title: "A cluster of pneumonia in Wuhan"
  text: "The Wuhan Municipal Health Commission reports cases of viral pneumonia in the city. The WHO office in China picks up the statement and alerts the organisation."
  image: "assets/img/context/wuhan.jpg"
  image_page: "https://commons.wikimedia.org/wiki/File:Skyline_of_Wuhan-2.jpg"
  credit: "Majorantarktis, CC BY-SA 4.0, via Wikimedia Commons"
  image_idea: "Skyline of Wuhan (Wikimedia Commons)"
  source: "WHO, Listings of WHO's response to COVID-19"
  source_url: "https://www.who.int/news/item/29-06-2020-covidtimeline"
- date: "21 Jan 2020"
  title: "First case in the United States"
  text: "The CDC confirms the first case in the United States: a traveller back from Wuhan, in Washington State."
  image: "assets/img/context/virus-cdc.jpg"
  image_page: "https://wwwn.cdc.gov/PHIL/Details.aspx?pid=23312"
  credit: "CDC / Alissa Eckert, MSMI, Dan Higgins, MAMS (public domain)"
  image_idea: "CDC illustration of the coronavirus (public domain)"
  source: "CDC press release, 21 January 2020"
  source_url: "https://archive.cdc.gov/www_cdc_gov/media/releases/2020/p0121-novel-coronavirus-travel-case.html"
- date: "30 Jan 2020"
  title: "A global health emergency"
  text: "The WHO declares the outbreak a public health emergency of international concern. Three weeks later, US stocks are still at a record high."
  image: "assets/img/context/who-geneva.jpg"
  image_page: "https://commons.wikimedia.org/wiki/File:World_Health_Organisation_headquarters,_Geneva,_north_and_west_sides_2007.jpg"
  credit: "I, Yann, CC BY-SA 3.0, via Wikimedia Commons"
  image_idea: "WHO headquarters in Geneva (Wikimedia Commons)"
  source: "WHO, Listings of WHO's response to COVID-19"
  source_url: "https://www.who.int/news/item/29-06-2020-covidtimeline"
- date: "19 Feb 2020"
  title: "The market peaks"
  text: "The S&P 500 closes at an all-time high of 3,386. This is where our crisis window starts."
  image: "assets/img/context/nyse.jpg"
  image_page: "https://wwwn.cdc.gov/phil/Details.aspx?pid=1520"
  credit: "CDC / Dr. Edwin P. Ewing, Jr. (public domain)"
  image_idea: "Facade of the New York Stock Exchange (CDC, public domain)"
  source: "S&P Global, 29 days later"
  source_url: "https://www.spglobal.com/en/research-insights/market-insights/29-days-later"
- date: "21-24 Feb 2020"
  title: "Italy, and the first sharp fall"
  text: "Cases in Italy jump from three to more than a hundred, and a dozen northern towns are quarantined. On Monday 24 February, the Dow loses about 1,032 points (-3.6%)."
  image: "assets/img/context/italy-map.svg"
  image_page: "https://commons.wikimedia.org/wiki/File:COVID-19_Outbreak_Cases_in_Italy.svg"
  credit: "Night Lantern, CC BY-SA 4.0, via Wikimedia Commons"
  image_idea: "Map of cases in Italy (Wikimedia Commons)"
  source: "NPR, 24 February 2020"
  source_url: "https://www.npr.org/2020/02/24/808811280/stocks-fall-sharply-on-coronavirus-fears"
- date: "11 Mar 2020"
  title: "A pandemic"
  text: "The WHO says that COVID-19 can be characterised as a pandemic."
  image: "assets/img/context/world-map.svg"
  image_page: "https://commons.wikimedia.org/wiki/File:COVID-19_Outbreak_World_Map.svg"
  credit: "Various Commons editors. See file history for latest ones. Older versions: Svenskbygderna (original author); Ratherous, AKS471883 (contributors); authors of File:BlankMap-World.svg (source file), CC BY 4.0, via Wikimedia Commons"
  image_idea: "World map of reported cases (Wikimedia Commons)"
  source: "WHO, Listings of WHO's response to COVID-19"
  source_url: "https://www.who.int/news/item/29-06-2020-covidtimeline"
- date: "9-18 Mar 2020"
  title: "Trading halts and record fear"
  text: "The 7% circuit breaker stops US trading four times in March. On 16 March, the VIX, the market's fear index, closes at a record 82.69, above its 2008 peak of 80.74."
  image: "assets/img/context/vix-march-2020.png"
  image_page: ""
  credit: "Our data"
  image_idea: "Chart of the VIX or of SPY in March 2020, drawn from our own data"
  source: "CNBC, 16 March 2020 (VIX); IEX (circuit breakers)"
  source_url: "https://www.cnbc.com/2020/03/16/wall-streets-fear-gauge-hits-highest-level-ever.html"
- date: "23 Mar 2020"
  title: "The bottom, and the rescue"
  text: "The Federal Reserve announces extensive new measures to support the economy. The same day, the S&P 500 hits its low, about 34% below its peak. This is where our crisis window ends."
  image: "assets/img/context/fed.jpg"
  image_page: "https://commons.wikimedia.org/wiki/File:Marriner_S._Eccles_Federal_Reserve_Board_Building.jpg"
  credit: "AgnosticPreachersKid, CC BY-SA 3.0, via Wikimedia Commons"
  image_idea: "Federal Reserve building in Washington (Wikimedia Commons)"
  source: "Federal Reserve press release, 23 March 2020"
  source_url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20200323b.htm"
- date: "18 Aug 2020"
  title: "Back to a record"
  text: "Less than six months after the peak, the S&P 500 closes at a new record high, ending the shortest bear market in its history."
  image: "assets/img/context/spy-recovery-2020.png"
  image_page: ""
  credit: "Our data"
  image_idea: "Chart of SPY from February to August 2020, drawn from our own data"
  source: "NPR, 18 August 2020"
  source_url: "https://www.npr.org/sections/coronavirus-live-updates/2020/08/18/903252878/the-big-comeback-s-p-500-closes-at-record-high-6-months-after-coronavirus-plunge"
