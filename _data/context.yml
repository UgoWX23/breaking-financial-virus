# The context timeline (zigzag). One entry per date, in order.
# image: path in assets/img/context/ (leave "" until found). credit: author and licence, shown under the image.
# image_idea: what to look for. Prefer free images (Wikimedia Commons) and credit them.
# Avoid photos of identifiable people: places, objects and charts work better here.
# TO CHECK: every date and fact against a source before publishing (WHO, NBER, S&P).
- date: "31 Dec 2019"
  title: "A cluster of pneumonia in Wuhan"
  text: "China reports a cluster of pneumonia cases of unknown cause in Wuhan to the World Health Organization."
  image: ""
  credit: ""
  image_idea: "Wuhan skyline or a map of China with Wuhan marked"
- date: "21 Jan 2020"
  title: "First case in the United States"
  text: "The first confirmed case is reported in the United States. Markets barely move."
  image: ""
  credit: ""
  image_idea: "Airport arrivals hall"
- date: "30 Jan 2020"
  title: "A global health emergency"
  text: "The WHO declares a public health emergency of international concern. Stocks keep rising."
  image: ""
  credit: ""
  image_idea: "WHO headquarters building in Geneva"
- date: "19 Feb 2020"
  title: "The market peaks"
  text: "The S&P 500 closes at a record high. This is where our crisis window starts."
  image: ""
  credit: ""
  image_idea: "Facade of the New York Stock Exchange"
- date: "21-24 Feb 2020"
  title: "Italy, and the first sharp fall"
  text: "An outbreak appears in northern Italy. On Monday 24 February, US stocks have their first sharp fall."
  image: ""
  credit: ""
  image_idea: "Empty square in Milan or Lombardy"
- date: "9-16 Mar 2020"
  title: "Trading halts and record fear"
  text: "Circuit breakers stop trading several times. The VIX, the market's fear index, reaches its highest level since 2008."
  image: ""
  credit: ""
  image_idea: "A chart of the VIX in March 2020 (we can draw it from our data)"
- date: "11 Mar 2020"
  title: "A pandemic"
  text: "The WHO calls Covid-19 a pandemic."
  image: ""
  credit: ""
  image_idea: "World map of reported cases"
- date: "23 Mar 2020"
  title: "The bottom"
  text: "The S&P 500 hits its low, about a third below its peak. This is where our crisis window ends: 24 trading days after the peak."
  image: ""
  credit: ""
  image_idea: "A price board in red"
- date: "Late Mar 2020"
  title: "Rescue plans, and the rebound"
  text: "Central banks and governments announce large support measures. Markets start to recover."
  image: ""
  credit: ""
  image_idea: "Federal Reserve building in Washington"
