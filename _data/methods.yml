# One sheet per method. figs: the figures that use it (the site links back to them).
- id: market-model
  name: "Market model and residuals"
  what: "Removes the part of each return that the market explains, so that a market-wide fall is not mistaken for contagion."
  formula: '$$r_{i,t} = \alpha_i + \beta_i\, r_{m,t} + \varepsilon_{i,t}, \qquad z_{i,t} = \frac{\hat\varepsilon_{i,t}}{\hat\sigma^{PRE}_{\varepsilon,i}}$$'
  params: "Estimated on a calm year (PRE, 252 trading days) that ends 21 days before the crisis, then held fixed. Market = equal-weighted mean of log returns; SPY as a check."
  figs: [F2.3a, F2.3b, F2.4a, F3.1d]
- id: onset
  name: "Onset of a stock and of a sector"
  what: "The day a stock joins the crisis, and the day a sector does."
  formula: '$$\text{onset}_i = \min\{t : z_{i,t} < -k\}, \qquad \text{onset}_{s}^{q} = \min\{t : \text{share of } s \text{ hit} \ge q\}$$'
  params: "k = 3 by default, recomputed for k = 2, 3, 4 (Kendall rank correlation between the orders). q = 10%, 50%, 90%."
  figs: [F0.1, F1.1a, F1.1b, F1.1c, F1.1d, F1.1e, F3.1b, F3.2a]
- id: drawdown
  name: "Drawdown"
  what: "How far a price, or an equal-weighted sector index, is below its previous peak."
  formula: '$$DD_t = \frac{W_t}{\max_{s \le t} W_s} - 1, \qquad \text{MDD} = \min_t DD_t$$'
  params: "W = 1 at the peak of the market. Recovery time: days needed to recover half of the maximum loss."
  figs: [F1.2a, F1.2b, F1.2c, F1.3a, F1.3b]
- id: defensive
  name: "Defensive and cyclical groups"
  what: "Health Care, Consumer Staples and Utilities are defensive, Communication Services is mixed, the rest is cyclical. The list is fixed before looking at results."
  formula: '$$\text{ratio} = \frac{\text{MDD}_{\text{defensive}}}{\text{MDD}_{\text{cyclical}}}$$'
  params: "Confidence interval by bootstrap on the stocks. A ratio below 1: defensive stocks held up better."
  figs: [F1.3a, F1.3b, F3.2a, F3.2b]
- id: pca
  name: "Principal component analysis"
  what: "Two PCAs: on the features (stock x feature, one per crisis) to see which features matter, and on returns (date x stock) to see how much the market and each sector explain."
  formula: '$$X = U \Sigma V^\top, \qquad \text{explained}_j = \frac{\sigma_j^2}{\sum_k \sigma_k^2}$$'
  params: "Features standardised, winsorised at 1% and 99%. Similarity between crises: cosine of the loadings. Leave one crisis out."
  figs: [F1.4a, F1.4b, F1.4c, F1.4d, F1.4e]
- id: event-study
  name: "Event study"
  what: "Average reaction of other stocks after a shock, same sector against other sectors."
  formula: '$$AR_{j,t} = r_{j,t} - (\hat\alpha_j + \hat\beta_j r_{m,t}), \qquad CAR_j = \sum_{t=1}^{10} AR_{j,t}$$'
  params: "Shock: residual below -3 sigma on a day without a market-wide fall. Estimation window [-120, -20], reaction window [+1, +10]. Bootstrap bands."
  figs: [F2.3b, F2.3c, F2.2a, F2.5a, F2.4c]
- id: granger
  name: "Lead-lag tests with Benjamini-Hochberg"
  what: "Whether the past of stock A helps predict stock B, tested on every pair, with control of false positives."
  formula: '$$r_{B,t} = \sum_{l=1}^{L} a_l\, r_{B,t-l} + \sum_{l=1}^{L} b_l\, r_{A,t-l} + u_t, \qquad H_0 : b_1 = \dots = b_L = 0$$'
  params: "Residual returns. Restricted to the top stocks by dollar volume per sector. False discovery rate 5%. Read as association, never as cause."
  figs: [F2.3d, F2.4a, F3.1d, F3.3f]
- id: network
  name: "Directed network"
  what: "Significant lead-lag links become arrows. Who precedes whom, and who emits the most."
  formula: '$$\text{out-degree}(i) = \#\{j : i \to j\}, \qquad PR(i) = \frac{1-d}{N} + d \sum_{j \to i} \frac{PR(j)}{\text{out}(j)}$$'
  params: "d = 0.85."
  figs: [F2.4a, F2.4b, F2.2b, F3.1a, F4.2]
- id: permutation
  name: "Permutation test"
  what: "Shuffles the sector labels many times to see what the same-sector effect looks like by chance."
  formula: '$$p = \frac{1 + \#\{\text{shuffles with effect} \ge \text{observed}\}}{1 + B}$$'
  params: "B = 1,000 shuffles, keeping sector sizes."
  figs: [F2.6a, F2.6b]
- id: propagation-metrics
  name: "Speed, breadth, intensity, attenuation"
  what: "Four words, one definition each, so that everyone in the group means the same thing."
  formula: '$$\text{speed} = t_{90} - t_{10}, \quad \text{breadth} = \max_t \text{share hit}, \quad \text{intensity} = \text{MDD}, \quad \text{attenuation} = t_{\text{half recovery}}$$'
  params: "Days, share of stocks, percentage, days. Computed per sector."
  figs: [F3.1c, F3.1e]
- id: clustering
  name: "Clustering and comparison with sectors"
  what: "Groups stocks by how they behaved (k-means and hierarchical) and checks whether the groups match the official sectors."
  formula: '$$\text{ARI} = \frac{\text{RI} - E[\text{RI}]}{\max \text{RI} - E[\text{RI}]}, \qquad \text{NMI} = \frac{2\, I(C;S)}{H(C) + H(S)}$$'
  params: "On the features fixed in chapter 1. Computed in a calm period and in the crisis."
  figs: [F4.1a, F4.1b, F4.1c]
- id: regional-alignment
  name: "Market and epidemic onsets by region"
  what: "Compares the day each region's market joins the crash with the day the epidemic becomes visible there."
  formula: '$$\rho_S = \text{corr}\big(\text{rank}(\text{onset}^{\text{virus}}),\ \text{rank}(\text{onset}^{\text{market}})\big)$$'
  params: "Regional ETFs listed in the US. Epidemic onset from case counts (source to add). Bootstrap interval; few points, so we speak of alignment, not proof."
  figs: [F3.3a, F3.3b, F3.3c, F3.3g]
